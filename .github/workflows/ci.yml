name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          node --version
          pnpm --version

      - name: Verify package metadata
        run: |
          node <<'NODE'
          const pkg = require("./package.json");

          if (pkg.packageManager !== "pnpm@11.17.0") {
            throw new Error(
              `expected packageManager pnpm@11.17.0, got ${pkg.packageManager}`
            );
          }

          console.log("package manager:", pkg.packageManager);
          NODE

          test -f pnpm-lock.yaml
          test -f pnpm-workspace.yaml
          test ! -e package-lock.json
          test -f go.mod
          test -f go.sum
          test -f pyproject.toml
          test -f uv.lock

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          enable-cache: false

      - name: Install libvips development files
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libvips-dev pkg-config

      - name: Run shared quality, dependency, and build gates
        run: make ci

  security:
    uses: ./.github/workflows/security.yml

  publish-container:
    needs: [ci, security]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Log in to GHCR
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          owner="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
          repository="$(printf '%s' "$repository" | tr '[:upper:]' '[:lower:]')"
          publish() {
            local image="$1" dockerfile="$2" context="$3"
            local tags=(--tag "$image:sha-${GITHUB_SHA:0:12}")
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              tags+=(--tag "$image:latest")
            elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              tags+=(--tag "$image:$GITHUB_REF_NAME" --tag "$image:latest")
            fi
            docker buildx build --push "${tags[@]}" --file "$dockerfile" "$context"
          }
          publish "ghcr.io/$owner/seasonalnet-icon-cdn" "Dockerfile" "."
