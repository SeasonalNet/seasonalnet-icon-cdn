name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          node --version
          pnpm --version

      - name: Verify package metadata
        run: |
          node <<'NODE'
          const pkg = require("./package.json");

          if (pkg.packageManager !== "pnpm@11.17.0") {
            throw new Error(
              `expected packageManager pnpm@11.17.0, got ${pkg.packageManager}`
            );
          }

          console.log("package manager:", pkg.packageManager);
          NODE

          test -f pnpm-lock.yaml
          test -f pnpm-workspace.yaml
          test ! -e package-lock.json
          test -f go.mod
          test -f go.sum
          test -f requirements-ci.txt

      - name: Install libvips development files
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libvips-dev pkg-config python3-venv

      - name: Run shared quality, dependency, and build gates
        run: make ci
