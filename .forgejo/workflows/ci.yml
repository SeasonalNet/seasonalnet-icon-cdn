name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: [docker, slate-builder]

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          node --version
          pnpm --version

      - name: Verify package metadata
        run: |
          node <<'NODE'
          const pkg = require("./package.json");

          if (pkg.packageManager !== "pnpm@11.17.0") {
            throw new Error(
              `expected packageManager pnpm@11.17.0, got ${pkg.packageManager}`
            );
          }

          console.log("package manager:", pkg.packageManager);
          NODE

          test -f pnpm-lock.yaml
          test -f pnpm-workspace.yaml
          test ! -e package-lock.json
          test -f go.mod
          test -f go.sum
          test -f pyproject.toml
          test -f uv.lock

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.20
          enable-cache: false

      - name: Install libvips development files
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends docker.io docker-buildx libvips-dev pkg-config

      - name: Run shared quality, dependency, and build gates
        run: make ci
