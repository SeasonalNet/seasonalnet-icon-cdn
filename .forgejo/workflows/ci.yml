name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  version:
    name: Resolve and validate software version
    runs-on: docker
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      revision: ${{ steps.metadata.outputs.revision }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
      image_tag: ${{ steps.metadata.outputs.image_tag }}
      stable: ${{ steps.metadata.outputs.stable }}
    steps:
      - name: Check out complete Git history and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Test Git version resolution
        run: sh tools/test-version.sh
      - name: Resolve build identity and validate release tags
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$(sh tools/version.sh --release "$GITHUB_REF_NAME")"
            image_tag="$(sh tools/version.sh --image-tag "$GITHUB_REF_NAME")"
            stable="$(sh tools/version.sh --stable "$GITHUB_REF_NAME")"
          else
            version="$(sh tools/version.sh)"
            image_tag=""
            stable=false
          fi
          printf 'version=%s\nrevision=%s\ntimestamp=%s\nimage_tag=%s\nstable=%s\n' \
            "$version" "$(sh tools/version.sh --revision)" "$(sh tools/version.sh --timestamp)" \
            "$image_tag" "$stable" >> "$GITHUB_OUTPUT"

  go:
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      APP_REVISION: ${{ needs.version.outputs.revision }}
      APP_BUILD_DATE: ${{ needs.version.outputs.timestamp }}
    needs: [version]
    runs-on: [docker, slate-builder]

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          node --version
          pnpm --version

      - name: Verify package metadata
        run: |
          node <<'NODE'
          const pkg = require("./package.json");

          if (pkg.packageManager !== "pnpm@12.15.0") {
            throw new Error(
              `expected packageManager pnpm@12.15.0, got ${pkg.packageManager}`
            );
          }

          console.log("package manager:", pkg.packageManager);
          NODE

          test -f pnpm-lock.yaml
          test -f pnpm-workspace.yaml
          test ! -e package-lock.json
          test -f go.mod
          test -f go.sum
          test -f pyproject.toml
          test -f uv.lock

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6
          enable-cache: false
      - name: Install stable Python
        run: uv python install 3.15.1

      - name: Install Docker CLI, Buildx, and libvips development files
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl libvips-dev pkg-config
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          . /etc/os-release
          test "$ID" = debian
          printf '%s\n' \
            "Types: deb" \
            "URIs: https://download.docker.com/linux/debian" \
            "Suites: $VERSION_CODENAME" \
            "Components: stable" \
            "Architectures: $(dpkg --print-architecture)" \
            "Signed-By: /etc/apt/keyrings/docker.asc" \
            > /etc/apt/sources.list.d/docker.sources
          apt-get update
          apt-get install --yes --no-install-recommends docker-ce-cli docker-buildx-plugin

      - name: Verify Docker daemon access
        run: |
          docker version
          docker buildx version

      - name: Run shared quality, dependency, and build gates
        run: make ci

  publish-container:
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      APP_REVISION: ${{ needs.version.outputs.revision }}
      APP_BUILD_DATE: ${{ needs.version.outputs.timestamp }}
      IMAGE_TAG: ${{ needs.version.outputs.image_tag }}
      IMAGE_STABLE: ${{ needs.version.outputs.stable }}
    name: Publish container images
    needs: [go, version]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [docker, slate-builder]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Docker CLI and Buildx
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          . /etc/os-release
          test "$ID" = debian
          printf '%s\n' \
            "Types: deb" \
            "URIs: https://download.docker.com/linux/debian" \
            "Suites: $VERSION_CODENAME" \
            "Components: stable" \
            "Architectures: $(dpkg --print-architecture)" \
            "Signed-By: /etc/apt/keyrings/docker.asc" \
            > /etc/apt/sources.list.d/docker.sources
          apt-get update
          apt-get install --yes --no-install-recommends docker-ce-cli docker-buildx-plugin
          docker version
          docker buildx version
      - name: Trust the SeasonalNet Harbor CA
        run: update-ca-certificates
      - name: Log in to Harbor
        env:
          HARBOR_CI_USERNAME: ${{ secrets.HARBOR_CI_USERNAME }}
          HARBOR_CI_PASSWORD: ${{ secrets.HARBOR_CI_PASSWORD }}
        run: printf '%s' "$HARBOR_CI_PASSWORD" | docker login registry.lan.seasonalnet.org --username "$HARBOR_CI_USERNAME" --password-stdin
      - name: Build and push images
        shell: bash
        run: |
          set -euo pipefail
          publish() {
            local image="$1" dockerfile="$2" context="$3"
            local tags=(--tag "$image:sha-${GITHUB_SHA:0:12}")
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              tags+=(--tag "$image:latest")
            elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              tags+=(--tag "$image:$IMAGE_TAG")
              if [[ "$IMAGE_STABLE" == true ]]; then tags+=(--tag "$image:latest"); fi
            fi
            sh tools/build-image.sh --push "${tags[@]}" --file "$dockerfile" "$context"
          }
          publish "registry.lan.seasonalnet.org/seasonalnet/seasonalnet-icon-cdn" "Dockerfile" "."
